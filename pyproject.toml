[project]
name = "wow-addon-packager"
version = "0.14.0"
description = "A developer-friendly World of Warcraft addon packager"
readme = "README.md"
license = "MIT"
dependencies = [
    "arrow>=1.4.0",
    "attrs>=25.4.0",
    "click>=8.3.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "respx>=0.22.0",
    "rich>=14.3.1",
    "watchfiles>=1.1.1",
]
keywords = ["World of Warcraft", "WoW", "Addons"]
authors = [{ name = "Tim Martin", email = "tim@timmart.in" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">= 3.14"

[project.urls]
homepage = "https://github.com/t-mart/wap"
repository = "https://github.com/t-mart/wap"
documentation = "https://t-mart.github.io/wap/"

[project.scripts]
wap = "wap.__main__:main"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "glom>=25.12.0",
    "mkdocs-material>=9.7.1",
    "multipart>=1.3.0",
    "pre-commit>=4.5.1",
    "pygments>=2.19.2",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "twine>=6.2.0",
    "ty>=0.0.14",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wap"

[tool.uv]
package = true